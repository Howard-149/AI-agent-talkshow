# Minimal pairs for the listening test (eval/README.md): 30 hand-written topics.
#
# Per topic: `turn1` is the live opening human turn whose panel beat becomes the
# shared, replayed prefix. `turn2` holds the edited human turn, one text per
# condition. `orig` addresses Ryan (commentator) so `addressee` can redirect the
# same question to Amy (guest). `persona_swap` reuses the orig text; the agent
# swaps guest<->commentator persona configs for the post-edit lines instead.
#
# Edits are minimal: change one thing, keep length / register / everything else.
#   paraphrase  meaning-preserving rewrite (noise control; expect R ≈ 1)
#   negate      flip the stance of the claim
#   number      change the key number so the claim's magnitude changes
#   entity      swap the key named entity for another plausible one
#   addressee   same question, directed at the other panelist
#   num_small / num_large / num_flip / num_pointer   graded number edits: a small change, an order of
#               magnitude, a figure that contradicts the turn's own claim, num_large plus a sentence pointing at it

