# Same-speaker emotional reference clips for CosyVoice instruct2 (one MSP-Podcast 2.0
# speaker per role, one clip per emotion). The clone copies the reference's timbre, so every
# emotion of a role comes from the same speaker; labels without a clip (Fear, Disgust,
# Contempt, …) use that speaker's Neutral. Clips of one MSP speaker can still sound like
# different people (other episodes, rooms, mics): on 2026-11-11 each emotion clip was
# re-picked among the speaker's clips of that label (3–12 s) for speaker similarity to the
# role's Neutral (CosyVoice's campplus embedding; eval/msp_ref_similarity.py), e.g. Amy
# Sadness 0.54 → 0.88, then for the clearest label (arousal / valence).
#
# Audio is not committed (MSP-Podcast licence: academic use). Bake on Babel:
#   python deploy/bake_msp_emotion_refs.py      → cosyvoice-prompts/msp/<role>/<Emotion>.wav
# Turn on with COSYVOICE_EMOTION_REFS=1 (COSYVOICE_MODE=instruct2).
