# Same-speaker emotional reference clips for CosyVoice instruct2 (one MSP-Podcast 2.0
# speaker per role, one clip per emotion). The clone copies the reference's timbre, so every
# emotion of a role comes from the same speaker; labels without a clip (Fear, Disgust,
# Contempt, …) use that speaker's Neutral. Clips of one MSP speaker can still sound like
# different people (other episodes, rooms, mics): on 2026-11-11 each emotion clip was
# re-picked among the speaker's clips of that label (3–12 s) for speaker similarity to the
# role's Neutral (CosyVoice's campplus embedding; eval/msp_ref_similarity.py), e.g. Amy
# Sadness 0.54 → 0.88, then for the clearest label (arousal / valence).
#
# Audio is not committed (MSP-Podcast licence: academic use). Bake on Babel:
#   python deploy/bake_msp_emotion_refs.py      → cosyvoice-prompts/msp/<role>/<Emotion>.wav
# Turn on with COSYVOICE_EMOTION_REFS=1 (COSYVOICE_MODE=instruct2).
msp_root: /data/user_data/hsuanhal/MSP-PODCAST-Publish-2.0
roles:
  host:
    speaker: 210
    gender: Female
    refs:
      Neutral: MSP-PODCAST_2420_0861.wav
      Happiness: MSP-PODCAST_2420_0793.wav
      Anger: MSP-PODCAST_2420_0243.wav
      Sadness: MSP-PODCAST_2347_2359.wav
      Surprise: MSP-PODCAST_2421_1127.wav
  guest:
    speaker: 1115
    gender: Female
    # 2026-11-17: speaker 130 sounded like a different person from mood to mood, even with
    # clips re-picked by ear. 1115 ranked most consistent of the unheard female speakers
    # (eval/msp_female_candidates.py; each mood's clip picked for campplus similarity to the
    # speaker's Neutral), and her cloned lines stay closest to the same voice across moods
    # (mean 0.91 vs 0.77 for 130); chosen by ear from an A/B of five voices.
    refs:
      Neutral: MSP-PODCAST_1825_0075.wav
      Happiness: MSP-PODCAST_1825_0077.wav
      Anger: MSP-PODCAST_1825_0195.wav
      Sadness: MSP-PODCAST_1825_0009.wav
      Surprise: MSP-PODCAST_1825_0002.wav
  commentator:
