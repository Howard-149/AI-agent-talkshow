id: default
description: Host-moderated panel — Think & Action floor control

meet:
  default_room: talkshow-dev

turn_control:
  # host_moderated — Think & Action: listeners think on each line; a controller picks who speaks
  mode: host_moderated
  order: [human, host, commentator, guest]
  listen_role: host

# Unified panel dialogue styles — pick: all | rotate | random | none (off)
dialogue:
  library: panel
  pick: all
