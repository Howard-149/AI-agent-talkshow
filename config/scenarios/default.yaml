id: default
description: Host-moderated panel — hand-raise from Ryan/Amy, host grants floor

meet:
  default_room: talkshow-dev

turn_control:
  # host_moderated — panelists poll [raise:yes/no]; sole raiser gets floor; else host picks
  # panel_round_robin — fixed order (see panel_fixed.yaml)
  mode: host_moderated
  order: [human, host, commentator, guest]
  listen_role: host
