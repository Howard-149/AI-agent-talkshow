id: default
description: Host-moderated panel — hand-raise queue, host grants floor

meet:
  default_room: talkshow-dev

turn_control:
  # host_moderated — panelists poll [raise:yes/no]; sole raiser gets floor; else host picks
  # panel_round_robin — fixed order (see panel_fixed.yaml)
  mode: host_moderated
  order: [human, host, commentator, guest]
  listen_role: host

# Unified panel dialogue styles — pick: all injects full catalog every panel turn
dialogue:
  library: panel
  pick: all
